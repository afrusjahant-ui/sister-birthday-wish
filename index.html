<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sister! 🎉</title>
    <style>
        body {
            background-color: #ffe5ec;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            text-align: center;
            max-width: 350px;
        }
        h1 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #333;
            font-size: 16px;
            line-height: 1.5;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🎂👑</div>
        <h1>Happy Birthday Sister!</h1>
        <p>শুভ জন্মদিন! সবসময় অনেক ভালো থাকিস আর হাসিখুশি থাকিস! ❤️✨</p>
    </div>

</body>
</html>
