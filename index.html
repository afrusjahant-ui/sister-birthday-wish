<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fce4ec;
            text-align: center;
            overflow: hidden;
        }

        /* Page 1 */
        #page1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            color: #880e4f;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #e91e63;
            color: white;
            padding: 14px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #c2185b;
            transform: scale(1.08);
        }

        /* Page 2 (Scary Prank) */
        #page2 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 999;
        }

        #scary-img {
            width: 100%;
            height: 100%;
            /* contain ব্যবহার করায় পিকচারের অরিজিনাল রেশিও ঠিক থাকবে, ফাটবে না */
            object-fit: contain; 
        }

        /* Page 3 */
        #page3 {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fffde7;
        }

        #page3 h1 {
            color: #ff6f00;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        #page3 p {
            color: #f57f17;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Page 1 -->
    <div id="page1">
        <h1>🎉 Happy Birthday Sister! 🎂</h1>
        <p>Your special surprise gift is waiting for you...</p>
        <button class="btn" onclick="triggerPrank()">Click to See Your Gift 🎁</button>
    </div>

    <!-- Page 2 -->
    <div id="page2">
        <img id="scary-img" src="scary.jpg" alt="Scary Face">
        <audio id="scream-sound" src="scream.mp3" preload="auto"></audio>
    </div>

    <!-- Page 3 -->
    <div id="page3">
        <h1>🤣 Hahahaaa Just Kidding! 😜</h1>
        <p>ভয় পেয়েছিস নাকি? Happy Birthday again! ❤️</p>
    </div>

    <script>
        function triggerPrank() {
            const scaryImg = document.getElementById('scary-img');
            
            // GIF যাতে ক্লিকে সাথে সাথেই প্লে হওয়া শুরু করে (Cache bypass)
            const srcOriginal = "scary.jpg";
            scaryImg.src = srcOriginal + "?t=" + new Date().getTime();

            // Show Page 2
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';

            // Play Scream Audio
            const sound = document.getElementById('scream-sound');
            sound.currentTime = 0;
            sound.volume = 1.0;
            
            sound.play().catch(function(error) {
                console.log("Audio play failed:", error);
            });

            // Transition to Page 3 after 5 seconds (5000ms)
            setTimeout(function() {
                sound.pause();
                document.getElementById('page2').style.display = 'none';
                document.getElementById('page3').style.display = 'flex';
            }, 5000);
        }
    </script>
</body>
</html>
