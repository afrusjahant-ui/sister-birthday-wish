<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #fce4ec;
            text-align: center;
            overflow: hidden;
        }

        /* Page 1 Styles */
        #page1 {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p {
            color: #880e4f;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #e91e63;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #c2185b;
            transform: scale(1.05);
        }

        /* Page 2 Styles (Horror Jumpscare) */
        #page2 {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 999;
        }

        #scary-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Page 3 Styles (Prank Reveal) */
        #page3 {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #fffde7;
        }

        #page3 h1 {
            color: #ff6f00;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        #page3 p {
            color: #f57f17;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- Page 1: Normal Birthday Wish -->
    <div id="page1">
        <h1>🎉 Happy Birthday Sister! 🎂</h1>
        <p>Your special surprise gift is waiting for you...</p>
        <button class="btn" onclick="triggerPrank()">Click to See Your Gift 🎁</button>
    </div>

    <!-- Page 2: Horror Jumpscare -->
    <div id="page2">
        <img id="scary-img" src="https://i.imgur.com/8Q9Z42v.jpg" alt="Scary Face">
        <!-- High volume horror scream audio -->
        <audio id="scream-sound" src="https://www.soundjay.com/human/sounds/screaming-female-01.mp3" preload="auto"></audio>
    </div>

    <!-- Page 3: Prank Reveal -->
    <div id="page3">
        <h1>🤣 Hahahaaa Just Kidding! 😜</h1>
        <p>ভয় পেয়েছিস নাকি? Happy Birthday again! ❤️</p>
    </div>

    <script>
        function triggerPrank() {
            // Hide Page 1 and Show Page 2
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'block';

            // Play loud scream audio
            const sound = document.getElementById('scream-sound');
            sound.volume = 1.0; // Max volume
            sound.play().catch(error => console.log("Audio play error:", error));

            // Wait 3 seconds, then show Page 3
            setTimeout(function() {
                sound.pause();
                document.getElementById('page2').style.display = 'none';
                document.getElementById('page3').style.display = 'flex';
            }, 3000);
        }
    </script>
</body>
</html>
