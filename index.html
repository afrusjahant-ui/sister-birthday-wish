<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
}

/* =====================================================
   COMMON PAGE
===================================================== */

.page{
    position:absolute;
    inset:0;
    width:100%;
    height:100vh;
    display:none;
    overflow:hidden;
}

.page.active{
    display:flex;
}

/* =====================================================
   PAGE 1 — LOCK
===================================================== */

#lockPage{
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 20% 20%,#fff 0,transparent 25%),
        linear-gradient(135deg,#ffeef4,#ffd7e4,#fff0f5);
}

.lock-card{
    width:min(350px,88%);
    background:#fff;
    padding:38px 25px 42px;
    text-align:center;

    border:4px solid #111;
    border-radius:26px;

    box-shadow:9px 11px 0 #111;

    animation:cardIn 1s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.75) translateY(30px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

.lock-icon{
    font-size:34px;
    display:inline-block;
    animation:lockShake 2s infinite;
}

@keyframes lockShake{
    0%,85%,100%{transform:rotate(0)}
    88%{transform:rotate(-8deg)}
    91%{transform:rotate(8deg)}
    94%{transform:rotate(-5deg)}
}

.lock-title{
    color:#ff4168;
    font-size:25px;
    margin-left:7px;
}

.lock-text{
    margin:14px auto 23px;
    max-width:275px;

    color:#555;
    font-family:Arial,sans-serif;
    font-size:14px;
    line-height:1.5;
}

.unlock-btn{
    border:3px solid #000;
    background:#ff4b70;
    color:#fff;

    padding:13px 30px;
    border-radius:40px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:0 5px 0 #000;

    transition:.2s;
}

.unlock-btn:hover{
    transform:translateY(-3px);
    background:#ff315c;
}

.unlock-btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 #000;
}


/* =====================================================
   PAGE 2 — FIRST WISH
===================================================== */

#wishPage{
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(circle at 50% 30%,rgba(255,255,255,.9),transparent 30%),
        linear-gradient(135deg,#fff0f5,#ffd6e3,#ffeaf1);
}

.wish-glow{
    position:absolute;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(255,80,130,.12);

    filter:blur(60px);

    animation:glow 5s infinite alternate;
}

@keyframes glow{
    from{transform:scale(.8)}
    to{transform:scale(1.2)}
}

.wish-content{
    position:relative;
    z-index:5;

    width:min(900px,90%);
}

.wish-small{
    margin-bottom:28px;

    font-family:Arial,sans-serif;

    font-size:13px;
    letter-spacing:5px;

    color:#c55a78;
}

.type-line{
    min-height:55px;

    margin:15px 0;

    font-size:clamp(25px,5vw,48px);

    color:#ff3f6d;

    text-shadow:0 2px 15px rgba(255,50,100,.2);
}

.cursor{
    animation:blink .7s infinite;
}

@keyframes blink{
    50%{opacity:0}
}

.floating-heart{
    position:absolute;

    font-size:22px;

    opacity:.7;

    animation:floatUp linear infinite;
}

@keyframes floatUp{
    from{
        transform:translateY(110vh) rotate(0);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    to{
        transform:translateY(-20vh) rotate(360deg);
        opacity:0;
    }
}


/* =====================================================
   PAGE 3 — SURPRISE
===================================================== */

#surprisePage{
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
        radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 20%),
        radial-gradient(circle at 80% 80%,rgba(255,70,130,.15),transparent 25%),
        linear-gradient(135deg,#17091c,#3a102a,#160718);

    color:#fff;
}

.surprise-stars{
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1px),
        radial-gradient(circle,rgba(255,180,210,.8) 1px,transparent 1px);

    background-size:70px 70px,110px 110px;

    animation:starMove 18s linear infinite;

    opacity:.35;
}

@keyframes starMove{
    to{
        background-position:70px 100px,-110px -80px;
    }
}

.surprise-box{
    position:relative;
    z-index:5;

    width:min(850px,90%);
}

.surprise-title{
    font-size:clamp(32px,7vw,65px);

    text-shadow:
        0 0 10px #ff4f83,
        0 0 30px #ff4f83;

    animation:surprisePulse 2s infinite;
}

@keyframes surprisePulse{
    50%{
        transform:scale(1.03);

        text-shadow:
            0 0 20px #ff4f83,
            0 0 50px #ff4f83;
    }
}

.surprise-sub{
    margin-top:25px;

    font-family:Arial,sans-serif;

    color:#ffc4d7;

    font-size:16px;
}

.wait-btn{
    margin-top:40px;

    padding:15px 35px;

    border-radius:50px;

    border:2px solid #fff;

    background:rgba(255,70,120,.15);

    color:#fff;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.3s;

    box-shadow:0 0 25px rgba(255,70,120,.35);
}

.wait-btn:hover{
    background:#ff4775;

    transform:scale(1.08);

    box-shadow:0 0 45px rgba(255,70,120,.8);
}


/* =====================================================
   PAGE 4 — CINEMATIC TREE
===================================================== */

#treePage{
    background:
        radial-gradient(circle at 50% 20%,rgba(77,86,150,.18),transparent 30%),
        linear-gradient(180deg,#030513 0%,#080b20 55%,#10152c 100%);

    color:#fff;
}


/* =====================================================
   STARS
===================================================== */

#skyStars{
    position:absolute;
    inset:0;

    pointer-events:none;
}

.sky-star{
    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff;

    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{
        opacity:.15;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}


/* =====================================================
   MOON
===================================================== */

.moon{
    position:absolute;

    top:8%;
    right:8%;

    width:82px;
    height:82px;

    border-radius:50%;

    background:#fffbea;

    box-shadow:
        0 0 20px #fffbea,
        0 0 60px rgba(255,255,220,.4);

    opacity:0;

    animation:moonAppear 2s ease 1s forwards;
}

@keyframes moonAppear{
    to{
        opacity:1;
    }
}

.moon:after{
    content:"";

    position:absolute;

    width:82px;
    height:82px;

    border-radius:50%;

    background:#07091b;

    left:27px;
    top:-11px;
}


/* =====================================================
   TREE SCENE
===================================================== */

.tree-scene{
    position:absolute;

    left:0;
    bottom:0;

    width:58%;
    height:82%;

    transition:
        transform 2.2s cubic-bezier(.7,0,.2,1),
        left 2.2s cubic-bezier(.7,0,.2,1);
}

.tree-scene.move-right{
    left:7%;

    transform:scale(.82);
}


/* =====================================================
   GROUND GLOW
===================================================== */

.ground-glow{
    position:absolute;

    bottom:2%;
    left:50%;

    transform:translateX(-50%);

    width:330px;
    height:70px;

    border-radius:50%;

    background:rgba(255,90,140,.15);

    filter:blur(25px);

    opacity:0;

    animation:groundAppear 2s 2s forwards;
}

@keyframes groundAppear{
    to{
        opacity:1;
    }
}


/* =====================================================
   TREE TRUNK
===================================================== */

.tree-trunk{
    position:absolute;

    bottom:5%;
    left:50%;

    width:42px;
    height:0;

    transform:translateX(-50%);

    border-radius:45px 45px 15px 15px;

    background:
        linear-gradient(
            90deg,
            #1b0d09,
            #4e281a,
            #28130c
        );

    box-shadow:0 0 20px rgba(0,0,0,.5);

    animation:growTrunk 2.2s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes growTrunk{
    to{
        height:53%;
    }
}


/* =====================================================
   BRANCHES
===================================================== */

.branch{
    position:absolute;

    height:13px;

    background:#3b1d13;

    border-radius:30px;

    opacity:0;

    transform-origin:left center;
}

.branch1{
    width:210px;

    left:50%;
    bottom:39%;

    transform:rotate(-32deg) scaleX(0);

    animation:branchGrow 1.3s 1.5s forwards;
}

.branch2{
    width:210px;

    right:50%;
    bottom:45%;

    transform-origin:right center;

    transform:rotate(32deg) scaleX(0);

    animation:branchGrowRight 1.3s 1.7s forwards;
}

.branch3{
    width:155px;

    left:50%;
    bottom:57%;

    transform:rotate(-45deg) scaleX(0);

    animation:branchGrow 1s 2s forwards;
}

.branch4{
    width:155px;

    right:50%;
    bottom:59%;

    transform-origin:right center;

    transform:rotate(45deg) scaleX(0);

    animation:branchGrowRight 1s 2.2s forwards;
}

.branch5{
    width:120px;

    left:50%;
    bottom:68%;

    transform:rotate(-12deg) scaleX(0);

    animation:branchGrow 1s 2.3s forwards;
}

.branch6{
    width:120px;

    right:50%;
    bottom:70%;

    transform-origin:right center;

    transform:rotate(12deg) scaleX(0);

    animation:branchGrowRight 1s 2.4s forwards;
}

@keyframes branchGrow{
    to{
        opacity:1;
        transform:rotate(-32deg) scaleX(1);
    }
}

@keyframes branchGrowRight{
    to{
        opacity:1;
        transform:rotate(32deg) scaleX(1);
    }
}


/* =====================================================
   HEART LEAVES
===================================================== */

.heart-leaf{
    position:absolute;

    width:22px;
    height:22px;

    background:#ff4c80;

    transform:rotate(-45deg) scale(0);

    opacity:0;

    cursor:pointer;

    filter:
        drop-shadow(0 0 5px rgba(255,70,130,.7));

    animation:leafGrow 1s forwards,
              leafFloat 3s ease-in-out infinite alternate;
}

.heart-leaf:before,
.heart-leaf:after{
    content:"";

    position:absolute;

    width:22px;
    height:22px;

    background:inherit;

    border-radius:50%;
}

.heart-leaf:before{
    top:-11px;
    left:0;
}

.heart-leaf:after{
    left:11px;
    top:0;
}

@keyframes leafGrow{

    0%{
        opacity:0;
        transform:rotate(-45deg) scale(0);
    }

    70%{
        opacity:1;
        transform:rotate(-45deg) scale(1.25);
    }

    100%{
        opacity:1;
        transform:rotate(-45deg) scale(1);
    }
}

@keyframes leafFloat{

    from{
        margin-top:-3px;
    }

    to{
        margin-top:4px;
    }
}

.heart-leaf:hover{
    transform:rotate(-45deg) scale(1.5);

    filter:
        drop-shadow(0 0 10px #ff4778)
        drop-shadow(0 0 25px #ff4778);

    z-index:20;
}


/* =====================================================
   TREE POSITIONS
===================================================== */

.leaf1{left:38%;bottom:43%;animation-delay:3.3s}
.leaf2{left:29%;bottom:50%;animation-delay:3.5s}
.leaf3{left:23%;bottom:58%;animation-delay:3.7s}
.leaf4{left:35%;bottom:61%;animation-delay:3.9s}
.leaf5{left:44%;bottom:65%;animation-delay:4.1s}
.leaf6{left:47%;bottom:74%;animation-delay:4.3s}
.leaf7{left:31%;bottom:70%;animation-delay:4.5s}
.leaf8{left:19%;bottom:67%;animation-delay:4.7s}

.leaf9{right:38%;bottom:46%;animation-delay:3.4s}
.leaf10{right:29%;bottom:52%;animation-delay:3.6s}
.leaf11{right:23%;bottom:60%;animation-delay:3.8s}
.leaf12{right:34%;bottom:63%;animation-delay:4s}
.leaf13{right:44%;bottom:68%;animation-delay:4.2s}
.leaf14{right:47%;bottom:75%;animation-delay:4.4s}
.leaf15{right:31%;bottom:71%;animation-delay:4.6s}
.leaf16{right:19%;bottom:69%;animation-delay:4.8s}


/* =====================================================
   TREE INTRO
===================================================== */

.tree-intro{
    position:absolute;

    left:50%;
    top:8%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    z-index:50;

    opacity:0;

    animation:introFade 1.5s 1s forwards;
}

.tree-intro span{
    font-family:Arial,sans-serif;

    font-size:11px;

    letter-spacing:6px;

    color:#bfc6ff;
}

@keyframes introFade{
    to{
        opacity:1;
    }
}


/* =====================================================
   MESSAGE AREA
===================================================== */

.message-area{
    position:absolute;

    left:53%;
    top:25%;

    width:43%;

    opacity:0;

    transform:translateX(30px);

    text-align:left;

    z-index:100;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;
}

.message-area.show{
    opacity:1;

    transform:translateX(0);
}

.lucky-title{
    font-size:clamp(25px,4vw,45px);

    line-height:1.15;

    color:#fff;

    text-shadow:
        0 0 10px rgba(255,255,255,.3),
        0 0 30px rgba(255,90,140,.5);

    margin-bottom:25px;
}

.lucky-title .pink{
    color:#ff739a;
}


/* =====================================================
   HANDWRITING TEXT
===================================================== */

.handwriting-box{
    position:relative;

    min-height:210px;
}

.handwriting{
    font-family:
        "Segoe Print",
        "Bradley Hand",
        "Comic Sans MS",
        cursive;

    font-size:clamp(17px,2.2vw,26px);

    line-height:1.65;

    color:#fff5f8;

    text-shadow:
        0 0 8px rgba(255,100,150,.25);
}

.writing-cursor{
    display:inline-block;

    width:2px;
    height:1.1em;

    margin-left:4px;

    vertical-align:middle;

    background:#ff7b9f;

    box-shadow:0 0 10px #ff7b9f;

    animation:cursorBlink .7s infinite;
}

@keyframes cursorBlink{
    50%{
        opacity:0;
    }
}


/* =====================================================
   PEN
===================================================== */

.pen{
    position:absolute;

    width:36px;
    height:8px;

    background:linear-gradient(
        90deg,
        #d9d9d9,
        #fff,
        #aaa
    );

    border-radius:10px;

    opacity:0;

    transform:
        rotate(-18deg)
        translate(-10px,10px);

    transition:
        left .1s linear,
        top .1s linear,
        opacity .4s;
}

.pen:before{
    content:"";

    position:absolute;

    right:-9px;
    top:2px;

    width:0;
    height:0;

    border-left:10px solid #d9d9d9;
    border-top:2px solid transparent;
    border-bottom:2px solid transparent;
}

.pen.active{
    opacity:1;
}


/* =====================================================
   BALLOONS
===================================================== */

.balloon-zone{
    position:absolute;

    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:15;
}

.balloon{
    position:absolute;

    bottom:-150px;

    width:55px;
    height:70px;

    border-radius:
        50%
        50%
        45%
        45%;

    animation:balloonUp linear infinite;

    opacity:.9;
}

.balloon:before{
    content:"";

    position:absolute;

    bottom:-9px;
    left:50%;

    transform:translateX(-50%);

    width:10px;
    height:10px;

    background:inherit;

    clip-path:polygon(
        0 0,
        100% 0,
        50% 100%
    );
}

.balloon:after{
    content:"";

    position:absolute;

    left:50%;
    top:100%;

    width:1px;
    height:170px;

    background:rgba(255,255,255,.5);
}

.b1{
    left:4%;
    background:#ff587f;
    animation-duration:12s;
    animation-delay:1s;
}

.b2{
    left:13%;
    background:#ffd36e;
    animation-duration:15s;
    animation-delay:4s;
}

.b3{
    left:27%;
    background:#9c8cff;
    animation-duration:13s;
    animation-delay:2s;
}

.b4{
    right:17%;
    background:#ff79b0;
    animation-duration:14s;
    animation-delay:5s;
}

.b5{
    right:7%;
    background:#6de0ce;
    animation-duration:11s;
    animation-delay:3s;
}

.b6{
    right:29%;
    background:#ffd56d;
    animation-duration:16s;
    animation-delay:6s;
}

@keyframes balloonUp{

    0%{
        transform:
            translateY(0)
            translateX(0)
            rotate(-4deg);
    }

    25%{
        transform:
            translateY(-30vh)
            translateX(25px)
            rotate(5deg);
    }

    50%{
        transform:
            translateY(-60vh)
            translateX(-20px)
            rotate(-4deg);
    }

    75%{
        transform:
            translateY(-90vh)
            translateX(20px)
            rotate(4deg);
    }

    100%{
        transform:
            translateY(-125vh)
            translateX(-10px)
            rotate(-5deg);
    }
}


/* =====================================================
   BIRTHDAY STREAMERS / JORI
===================================================== */

.streamer-zone{
    position:absolute;

    inset:0;

    pointer-events:none;

    z-index:30;
}

.streamer{
    position:absolute;

    top:-120px;

    width:8px;
    height:180px;

    border-radius:20px;

    transform-origin:top center;

    opacity:.85;

    animation:
        streamerDrop 5s ease-in-out infinite;
}

.s1{
    left:5%;
    background:#ff6f91;
    animation-delay:.2s;
}

.s2{
    left:11%;
    background:#ffd166;
    animation-delay:1s;
}

.s3{
    left:18%;
    background:#7de2d1;
    animation-delay:.5s;
}

.s4{
    right:18%;
    background:#a88cff;
    animation-delay:1.5s;
}

.s5{
    right:10%;
    background:#ff6f91;
    animation-delay:.8s;
}

.s6{
    right:4%;
    background:#ffd166;
    animation-delay:1.2s;
}

@keyframes streamerDrop{

    0%,100%{
        transform:
            rotate(-12deg)
            translateY(-30px);
    }

    50%{
        transform:
            rotate(15deg)
            translateY(30px);
    }
}


/* =====================================================
   BIRTHDAY CONFETTI
===================================================== */

.confetti{
    position:absolute;

    width:7px;
    height:13px;

    top:-20px;

    opacity:0;

    animation:confettiFall linear infinite;

    z-index:40;
}

@keyframes confettiFall{

    0%{
        opacity:0;

        transform:
            translateY(0)
            rotate(0);
    }

    10%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translateY(110vh)
            rotate(720deg);
    }
}


/* =====================================================
   HEART POP
===================================================== */

.pop-heart{
    position:fixed;

    pointer-events:none;

    z-index:9999;

    font-size:20px;

    animation:popHeart 1s ease forwards;
}

@keyframes popHeart{

    0%{
        opacity:1;
        transform:translate(0,0) scale(.5);
    }

    100%{
        opacity:0;
        transform:
            translate(var(--x),var(--y))
            scale(1.4);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .moon{
        width:58px;
        height:58px;

        right:7%;
    }

    .moon:after{
        width:58px;
        height:58px;

        left:19px;
        top:-8px;
    }

    .tree-scene{
        width:100%;
        height:58%;

        bottom:0;
    }

    .tree-scene.move-right{
        left:-20%;
        transform:scale(.72);
    }

    .tree-trunk{
        width:31px;
    }

    .branch{
        height:9px;
    }

    .branch1,
    .branch2{
        width:150px;
    }

    .branch3,
    .branch4{
        width:105px;
    }

    .branch5,
    .branch6{
        width:80px;
    }

    .heart-leaf,
    .heart-leaf:before,
    .heart-leaf:after{
        width:17px;
        height:17px;
    }

    .heart-leaf:before{
        top:-8px;
    }

    .heart-leaf:after{
        left:8px;
    }

    .message-area{
        left:42%;
        top:17%;

        width:53%;
    }

    .lucky-title{
        font-size:25px;
    }

    .handwriting{
        font-size:15px;
        line-height:1.55;
    }

    .balloon{
        width:38px;
        height:50px;
    }

    .streamer{
        width:5px;
        height:130px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     PAGE 1 — LOCK
===================================================== -->

<section id="lockPage" class="page active">

    <div class="lock-card">

        <div>
            <span class="lock-icon">🔒</span>

            <span class="lock-title">
                Site Locked
            </span>
        </div>

        <p class="lock-text">
            Enter the password to unlock this
            little birthday surprise ❤️
        </p>

        <button
            class="unlock-btn"
            onclick="unlockSite()"
        >
            Unlock Now
        </button>

    </div>

</section>



<!-- =====================================================
     PAGE 2 — FIRST WISH
===================================================== -->

<section id="wishPage" class="page">

    <div class="wish-glow"></div>

    <div class="wish-content">

        <div class="wish-small">
            A LITTLE SOMETHING FOR YOU ❤️
        </div>

        <div
            id="wishLine1"

        ></div>

        <div
            id="wishLine2"
            class="type-line"
        ></div>

        <div
            id="wishLine3"
            class="type-line"
        ></div>

    </div>

</section>



<!-- =====================================================
     PAGE 3 — PRANK
===================================================== -->

<section id="surprisePage" class="page">

    <div class="surprise-box">

        <div class="surprise-title">

        </div>

        <button

        >
            WAIT... WHAT? 👀
        </button>

    </div>

</section>



<!-- =====================================================
     PAGE 4 — MAIN CINEMATIC SURPRISE
===================================================== -->

<section id="treePage" class="page">


    <!-- SKY -->

    <div id="skyStars"></div>

    <div class="moon"></div>



    <!-- TOP INTRO -->

    <div class="tree-intro">

            SOMETHING SPECIAL IS GROWING...

    <!-- BALLOONS -->

    <div class="balloon-zone">

        <div class="balloon b2"></div>
        <div class="balloon b3"></div>
        <div class="balloon b4"></div>
        <div class="balloon b5"></div>
        <div class="balloon b6"></div>

    </div>



    <!-- STREAMERS / JORI -->

    <div class="streamer-zone">

        <div class="streamer s1"></div>
        <div class="streamer s2"></div>
        <div class="streamer s3"></div>
        <div class="streamer s4"></div>
        <div class="streamer s5"></div>
        <div class="streamer s6"></div>

    </div>



    <!-- TREE -->

    <div
        id="treeScene"
        class="tree-scene"
    >

        <div class="ground-glow"></div>

        <div class="tree-trunk"></div>

        <div class="branch branch1"></div>
        <div class="branch branch2"></div>
        <div class="branch branch3"></div>
        <div class="branch branch4"></div>
        <div class="branch branch5"></div>
        <div class="branch branch6"></div>


        <!-- HEART LEAVES -->

        <div class="heart-leaf leaf1"></div>
        <div class="heart-leaf leaf2"></div>
        <div class="heart-leaf leaf3"></div>
        <div class="heart-leaf leaf4"></div>
        <div class="heart-leaf leaf5"></div>
        <div class="heart-leaf leaf6"></div>
        <div class="heart-leaf leaf7"></div>
        <div class="heart-leaf leaf8"></div>

        <div class="heart-leaf leaf9"></div>
        <div class="heart-leaf leaf10"></div>
        <div class="heart-leaf leaf11"></div>
        <div class="heart-leaf leaf12"></div>
        <div class="heart-leaf leaf13"></div>
        <div class="heart-leaf leaf14"></div>
        <div class="heart-leaf leaf15"></div>
        <div class="heart-leaf leaf16"></div>

    </div>



    <!-- MESSAGE -->

    <div
        id="messageArea"
        class="message-area"
    >

        <div class="lucky-title">

            The world got
            <span class="pink">
                luckier
            </span>
            the day you were born. ❤️

        </div>


        <div class="handwriting-box">

            <div
                id="handwriting"
                class="handwriting"

            <div
                id="pen"
                class="pen"
            ></div>

    </div>


</section>



<!-- =====================================================
     MUSIC
===================================================== -->

<audio
    id="birthdayMusic"
    loop
    preload="auto"
>

    <source
        src="music/earrings.mp3"
        type="audio/mpeg"
    >

</audio>



<script>

/* =====================================================
   PAGE SWITCH
===================================================== */

function showPage(id){

    document
        .querySelectorAll(".page")
        .forEach(page=>{
            page.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   PASSWORD
===================================================== */

function unlockSite(){

    const password =
        prompt("Enter Password to Access the Website:");

    if(password === "saba123"){

        showPage("wishPage");

        createFloatingHearts();

        startBirthdayWish();

    }

    else if(password !== null){

        alert("Wrong password 😭");

    }

}


/* =====================================================
   FLOATING HEARTS
===================================================== */

function createFloatingHearts(){

    const symbols=[
        "❤️",
        "💗",
        "💕",
        "💖",
        "✨"
    ];

    for(let i=0;i<18;i++){

        const heart=
            document.createElement("div");

        heart.className=
            "floating-heart";

        heart.innerHTML=
            symbols[
                Math.floor(
                    Math.random()*symbols.length
                )
            ];

        heart.style.left=
            Math.random()*100+"%";

        heart.style.animationDuration=
            (6+Math.random()*7)+"s";

        heart.style.animationDelay=
            Math.random()*6+"s";

        heart.style.fontSize=
            (15+Math.random()*15)+"px";

        document
            .getElementById("wishPage")
            .appendChild(heart);

    }

}


/* =====================================================
   NORMAL TYPEWRITER
===================================================== */

function typeWriter(element,text,speed=60){

    return new Promise(resolve=>{

        let index=0;

        element.innerHTML=
            '<span class="cursor">|</span>';

        const timer=
            setInterval(()=>{

                if(index<text.length){

                    element.innerHTML=
                        text.substring(0,index+1)
                        +
                        '<span class="cursor">|</span>';

                    index++;

                }

                else{

                    clearInterval(timer);

                    element.innerHTML=text;

                    resolve();

                }

            },speed);

    });

}


/* =====================================================
   FIRST WISH
===================================================== */

async function startBirthdayWish(){

    await wait(700);

    await typeWriter(
        document.getElementById("wishLine1"),
        "Happy Birthday to youu ❤️",
        75
    );

    await wait(500);

    await typeWriter(
        document.getElementById("wishLine2"),
        "Thank youu soo muchhh for coming into my lifeee 🥹💗",
        55
    );

    await wait(500);

    await typeWriter(
        document.getElementById("wishLine3"),
        "Happy Birthday againnn! 🎂✨",
        70
    );

    await wait(10000);

    showPage("surprisePage");

}


/* =====================================================
   WAIT FUNCTION
===================================================== */

function wait(ms){

    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );

}


/* =====================================================
   MAIN SURPRISE
===================================================== */

async function continueSurprise(){

    showPage("treePage");

    createStars();

    createConfetti();

    const music=
        document.getElementById(
            "birthdayMusic"
        );

    music.volume=.55;

    music.play().catch(()=>{});


    /*
       STEP 1:
       TREE GROWS
    */

    await wait(6500);


    /*
       STEP 2:
       TREE MOVES TO SIDE
    */

    document
        .getElementById("treeScene")
        .classList.add("move-right");


    await wait(1900);


    /*
       STEP 3:
       MESSAGE APPEARS
    */

    document
        .getElementById("messageArea")
        .classList.add("show");


    await wait(900);


    /*
       STEP 4:
       HANDWRITING STARTS
    */

    startHandwriting();

}


/* =====================================================
   STARS
===================================================== */

function createStars(){

    const container=
        document.getElementById(
            "skyStars"
        );

    container.innerHTML="";

    for(let i=0;i<100;i++){

        const star=
            document.createElement("div");

        star.className=
            "sky-star";

        star.style.left=
            Math.random()*100+"%";

        star.style.top=
            Math.random()*100+"%";

        star.style.animationDelay=
            Math.random()*3+"s";

        star.style.animationDuration=
            (1+Math.random()*3)+"s";

        const size=
            1+Math.random()*3;

        star.style.width=
            size+"px";

        star.style.height=
            size+"px";

        container.appendChild(star);

    }

}


/* =====================================================
   CONFETTI
===================================================== */

function createConfetti(){

    const page=
        document.getElementById(
            "treePage"
        );

    const colors=[
        "#ff6f91",
        "#ffd166",
        "#7de2d1",
        "#a88cff",
        "#ffffff"
    ];

    for(let i=0;i<35;i++){

        const piece=
            document.createElement("div");

        piece.className=
            "confetti";

        piece.style.left=
            Math.random()*100+"%";

        piece.style.background=
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ];

        piece.style.animationDuration=
            (5+Math.random()*7)+"s";

        piece.style.animationDelay=
            Math.random()*7+"s";

        piece.style.transform=
            "rotate("+Math.random()*360+"deg)";

        page.appendChild(piece);

    }

}


/* =====================================================
   HANDWRITING TYPEWRITER
===================================================== */

async function startHandwriting(){

    const textElement=
        document.getElementById(
            "handwriting"
        );

    const pen=
        document.getElementById(
            "pen"
        );


    const lines=[

        "Happy Birthday to youu ❤️",

        "The one of the sweetest and chaotic person in my lifee. 🥹",

        "Many many happy returns of the dayyy! 🎂",

        "Stay exactly the way you are. ❤️"

    ];


    pen.classList.add("active");


    for(let line of lines){

        await writeHandLine(
            textElement,
            pen,
            line
        );

        await wait(500);

        textElement.innerHTML+="<br>";

    }


    pen.classList.remove("active");

}


/* =====================================================
   REAL-TIME WRITING EFFECT
===================================================== */

function writeHandLine(
    element,
    pen,
    text
){

    return new Promise(resolve=>{

        let index=0;

        const cursor=
            document.createElement("span");

        cursor.className=
            "writing-cursor";


        element.appendChild(cursor);


        const timer=
            setInterval(()=>{

                if(index<text.length){

                    /*
                       Put every new character
                       before the cursor.
                    */

                    const char=
                        document.createTextNode(
                            text[index]
                        );

                    element.insertBefore(
                        char,
                        cursor
                    );

                    index++;


                    /*
                       Move the pen slightly
                       while writing.
                    */

                    pen.style.transform=
                        "rotate(-18deg) translate("
                        +
                        (index*2)
                        +
                        "px,10px)";


                }

                else{

                    clearInterval(timer);

                    cursor.remove();

                    resolve();

                }

            },65);

    });

}


/* =====================================================
   HEART INTERACTION
===================================================== */

function activateHeartLeaves(){

    document
        .querySelectorAll(".heart-leaf")
        .forEach(leaf=>{

            leaf.addEventListener(
                "click",
                function(){

                    const rect=
                        leaf.getBoundingClientRect();

                    const x=
                        rect.left+
                        rect.width/2;

                    const y=
                        rect.top+
                        rect.height/2;


                    for(let i=0;i<10;i++){

                        const heart=
                            document.createElement(
                                "div"
                            );

                        heart.className=
                            "pop-heart";

                        heart.innerHTML=
                            Math.random()>.4
                            ? "❤️"
                            : "✨";

                        heart.style.left=
                            x+"px";

                        heart.style.top=
                            y+"px";

                        heart.style.setProperty(
                            "--x",
                            (
                                Math.random()*150-75
                            )+"px"
                        );

                        heart.style.setProperty(
                            "--y",
                            (
                                Math.random()*150-100
                            )+"px"
                        );

                        document
                            .body
                            .appendChild(heart);


                        setTimeout(
                            ()=>heart.remove(),
                            1000
                        );

                    }


                    leaf.style.filter=
                        `
                        drop-shadow(0 0 12px #fff)
                        drop-shadow(0 0 30px #ff4778)
                        `;


                    setTimeout(()=>{

                        leaf.style.filter=
                            `
                            drop-shadow(
                                0 0 5px
                                rgba(255,60,120,.6)
                            )
                            `;

                    },700);

                }
            );

        });

}


/* =====================================================
   MOUSE HEART TRAIL
===================================================== */

let lastTrail=0;

document.addEventListener(
    "mousemove",
    function(e){

        if(
            !document
                .getElementById("treePage")
                .classList
                .contains("active")
        ){
            return;
        }

        const now=
            Date.now();

        if(now-lastTrail<140){
            return;
        }

        lastTrail=now;


        const heart=
            document.createElement("div");

        heart.className=
            "pop-heart";

        heart.innerHTML=
            Math.random()>.5
            ? "♡"
            : "✨";

        heart.style.left=
            e.clientX+"px";

        heart.style.top=
            e.clientY+"px";

        heart.style.fontSize="12px";

        heart.style.setProperty(
            "--x",
            (Math.random()*30-15)+"px"
        );

        heart.style.setProperty(
            "--y",
            (-20-Math.random()*20)+"px"
        );

        document
            .body
            .appendChild(heart);


        setTimeout(
            ()=>heart.remove(),
            1000
        );

    }
);


/* =====================================================
   START TREE INTERACTION
===================================================== */

activateHeartLeaves();


/* =====================================================
   PREVENT DRAGGING
===================================================== */

document.addEventListener(
    "dragstart",
    e=>e.preventDefault()
);

</script>

</body>
</html>
