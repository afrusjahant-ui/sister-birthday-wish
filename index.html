<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Something Special ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Georgia, "Times New Roman", serif;

      /* Cute pink grid background */
      background-color: #ffe8ee;
      background-image:
        linear-gradient(#f8c8d4 1px, transparent 1px),
        linear-gradient(90deg, #f8c8d4 1px, transparent 1px);
      background-size: 32px 32px;

      overflow: hidden;
    }

    /* Soft floating hearts */
    .heart {
      position: fixed;
      color: rgba(255, 77, 109, 0.25);
      font-size: 25px;
      animation: float 7s linear infinite;
      pointer-events: none;
    }

    .heart:nth-child(1) {
      left: 10%;
      animation-delay: 0s;
    }

    .heart:nth-child(2) {
      left: 30%;
      animation-delay: 2s;
    }

    .heart:nth-child(3) {
      left: 55%;
      animation-delay: 4s;
    }

    .heart:nth-child(4) {
      left: 80%;
      animation-delay: 1s;
    }

    @keyframes float {
      0% {
        bottom: -50px;
        opacity: 0;
        transform: translateX(0) rotate(0deg);
      }

      20% {
        opacity: 1;
      }

      100% {
        bottom: 110vh;
        opacity: 0;
        transform: translateX(70px) rotate(180deg);
      }
    }

    /* Lock card */
    .lock-card {
      width: min(90%, 390px);
      background: white;

      border: 4px solid #111;
      border-radius: 28px;

      padding: 38px 30px 34px;

      text-align: center;

      box-shadow: 10px 10px 0 #111;

      animation: cardAppear 0.8s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .lock-icon {
      font-size: 48px;
      margin-bottom: 10px;

      animation: lockShake 2.5s infinite;
    }

    @keyframes lockShake {
      0%, 85%, 100% {
        transform: rotate(0);
      }

      88% {
        transform: rotate(-8deg);
      }

      91% {
        transform: rotate(8deg);
      }

      94% {
        transform: rotate(-5deg);
      }

      97% {
        transform: rotate(5deg);
      }
    }

    h1 {
      color: #ff4168;
      font-size: 29px;
      margin-bottom: 13px;
    }

    .subtitle {
      color: #555;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* Unlock button */
    .unlock-btn {
      border: 3px solid #111;
      background: #ff4d70;
      color: white;

      font-size: 17px;
      font-weight: bold;

      padding: 14px 32px;

      border-radius: 50px;
      cursor: pointer;

      box-shadow: 4px 5px 0 #111;

      transition: 0.2s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-3px);
      box-shadow: 4px 8px 0 #111;
      background: #ff365e;
    }

    .unlock-btn:active {
      transform: translateY(3px);
      box-shadow: 2px 2px 0 #111;
    }

    /* Password modal */
    .modal {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.55);

      backdrop-filter: blur(5px);

      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .password-box {
      width: min(90%, 400px);

      background: white;
      border: 4px solid #111;
      border-radius: 25px;

      padding: 30px;

      text-align: center;

      box-shadow: 8px 8px 0 #111;

      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .password-box h2 {
      color: #ff4168;
      margin-bottom: 8px;
    }

    .password-box p {
      font-family: Arial, sans-serif;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #passwordInput {
      width: 100%;

      padding: 14px 16px;

      border: 3px solid #222;
      border-radius: 12px;

      outline: none;

      font-size: 16px;
      text-align: center;

      margin-bottom: 14px;
    }

    #passwordInput:focus {
      border-color: #ff4d70;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-btn {
      border: 3px solid #111;
      border-radius: 30px;

      padding: 10px 22px;

      font-weight: bold;
      cursor: pointer;
    }

    .enter-btn {
      background: #ff4d70;
      color: white;
    }

    .cancel-btn {
      background: white;
      color: #111;
    }

    #errorMessage {
      color: #e6395b;
      font-family: Arial, sans-serif;
      font-size: 13px;

      min-height: 18px;
      margin-top: 12px;
    }

    /* Hidden main page for now */
    #mainContent {
      display: none;
    }

    /* Mobile */
    @media (max-width: 500px) {
      .lock-card {
        padding: 32px 22px;
      }

      h1 {
        font-size: 25px;
      }

      .lock-icon {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <!-- Floating hearts -->
  <div class="heart">♥</div>
  <div class="heart">♡</div>
  <div class="heart">♥</div>
  <div class="heart">♡</div>


  <!-- LOCK SCREEN -->
  <div class="lock-card" id="lockScreen">

    <div class="lock-icon">🔒</div>

    <h1>Site Locked</h1>

    <p class="subtitle">
      This little surprise is only for you. ❤️<br>
      Enter the password to unlock the magic.
    </p>

    <button class="unlock-btn" onclick="openPassword()">
      Unlock Now
    </button>

  </div>


  <!-- PASSWORD MODAL -->
  <div class="modal" id="passwordModal">

    <div class="password-box">

      <h2>🔐 Secret Access</h2>

      <p>
        Only someone special knows the password. ❤️
      </p>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password..."
        autocomplete="off"
      >

      <div class="modal-buttons">

        <button
          class="modal-btn cancel-btn"
          onclick="closePassword()">
          Cancel
        </button>

        <button
          class="modal-btn enter-btn"
          onclick="checkPassword()">
          Enter ❤️
        </button>

      </div>

      <div id="errorMessage"></div>

    </div>

  </div>


  <!-- MAIN WEBSITE -->
  <!-- We'll build this part next -->
  <div id="mainContent">
    <h1>Welcome ❤️</h1>
  </div>


  <script>

    /* =========================
       PASSWORD
       ========================= */

    const correctPassword = "11111111";


    /* Open password box */
    function openPassword() {

      document
        .getElementById("passwordModal")
        .classList.add("show");

      setTimeout(() => {
        document
          .getElementById("passwordInput")
          .focus();
      }, 200);
    }


    /* Close password box */
    function closePassword() {

      document
        .getElementById("passwordModal")
        .classList.remove("show");

      document
        .getElementById("passwordInput")
        .value = "";

      document
        .getElementById("errorMessage")
        .textContent = "";
    }


    /* Check password */
    function checkPassword() {

      const enteredPassword =
        document
          .getElementById("passwordInput")
          .value;

      const error =
        document.getElementById("errorMessage");


      if (enteredPassword === correctPassword) {

        error.style.color = "#16a34a";
        error.textContent = "Access granted! ❤️";


        setTimeout(() => {

          document
            .getElementById("lockScreen")
            .style.display = "none";

          document
            .getElementById("passwordModal")
            .classList.remove("show");

          /*
             MAIN WEBSITE WILL APPEAR HERE
             IN THE NEXT STEP.
          */

          document
            .getElementById("mainContent")
            .style.display = "block";

        }, 700);


      } else {

        error.style.color = "#e6395b";
        error.textContent = "Wrong password! Try again. 🔒";

        const input =
          document.getElementById("passwordInput");

        input.value = "";
        input.focus();

      }
    }


    /* Press Enter = submit password */
    document
      .getElementById("passwordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

        if (event.key === "Escape") {
          closePassword();
        }

      });


    /* Click outside modal = close */
    document
      .getElementById("passwordModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closePassword();
        }

      });

  </script>

</body>
</html>
