<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,serif;
}

body{
    background:#090015;
    color:white;
}

/* =========================
   COMMON PAGE
========================= */

.page{
    width:100%;
    height:100vh;
    display:none;
    position:relative;
    overflow:hidden;
}

.page.active{
    display:flex;
}

/* =========================
   PAGE 1 - LOCK
========================= */

#lockPage{
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,100,180,.25),transparent 30%),
        radial-gradient(circle at 80% 80%,rgba(120,80,255,.3),transparent 35%),
        linear-gradient(135deg,#12001f,#260035,#080015);
}

.lock-glow{
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle,rgba(255,80,170,.15),transparent 65%);
    filter:blur(20px);
}

.lock-card{
    position:relative;
    z-index:2;
    width:min(90%,420px);
    padding:45px 30px;
    border-radius:30px;
    text-align:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 0 60px rgba(255,80,180,.25);
    backdrop-filter:blur(15px);
}

.lock-icon{
    font-size:70px;
    margin-bottom:20px;
    animation:lockFloat 2s ease-in-out infinite;
}

@keyframes lockFloat{
    50%{transform:translateY(-10px) rotate(-3deg);}
}

.lock-card h1{
    font-size:30px;
    margin-bottom:12px;
}

.lock-card p{
    opacity:.8;
    margin-bottom:25px;
}

.unlock-btn{
    border:none;
    padding:14px 30px;
    border-radius:30px;
    background:linear-gradient(135deg,#ff4fa3,#8c52ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(255,60,170,.3);
}

/* =========================
   PAGE 2 - WISH
========================= */

#wishPage{
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 15% 20%,#ff4fa855,transparent 28%),
        radial-gradient(circle at 85% 70%,#7357ff55,transparent 30%),
        linear-gradient(135deg,#17001f,#35002e,#10001e);
}

.wish-box{
    width:min(90%,850px);
    z-index:3;
}

.wish-line{
    min-height:65px;
    font-size:clamp(25px,4vw,45px);
    line-height:1.5;
    text-shadow:0 0 20px #ff6bb5;
}

.floating-heart{
    position:absolute;
    font-size:20px;
    animation:heartFloat linear forwards;
    pointer-events:none;
}

@keyframes heartFloat{
    from{
        transform:translateY(110vh) scale(.5);
        opacity:0;
    }
    15%{opacity:1;}
    to{
        transform:translateY(-20vh) scale(1.3);
        opacity:0;
    }
}

/* =========================
   PAGE 3 - PRANK
========================= */

#surprisePage{
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(circle at 50% 40%,rgba(255,100,180,.18),transparent 35%),
        linear-gradient(135deg,#100018,#25002d,#090014);
}

.prank-content{
    z-index:5;
}

.prank-content h1{
    font-size:clamp(30px,6vw,70px);
    animation:prankGlow 2s infinite alternate;
}

@keyframes prankGlow{
    from{text-shadow:0 0 10px #ff4fa3;}
    to{text-shadow:0 0 35px #ff4fa3,0 0 70px #a64dff;}
}

.wait-btn{
    margin-top:40px;
    padding:16px 35px;
    border:none;
    border-radius:40px;
    color:white;
    background:linear-gradient(135deg,#ff4f9a,#7b4dff);
    font-size:18px;
    cursor:pointer;
    box-shadow:0 0 30px #ff4f9a66;
    transition:.3s;
}

.wait-btn:hover{
    transform:scale(1.08);
}

/* =========================
   PAGE 4 - TREE
========================= */

#treePage{
    background:
        radial-gradient(circle at 50% 20%,#302052 0%,transparent 30%),
        linear-gradient(180deg,#070013 0%,#100021 55%,#05000d 100%);
}

.moon{
    position:absolute;
    top:8%;
    right:9%;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#fff4cf;
    box-shadow:
        0 0 30px #fff3bb,
        0 0 90px rgba(255,240,180,.35);
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px white;
    animation:starTwinkle 2s infinite alternate;
}

@keyframes starTwinkle{
    from{opacity:.2;transform:scale(.7);}
    to{opacity:1;transform:scale(1.5);}
}

/* tree container */

.tree-scene{
    position:absolute;
    left:0;
    bottom:0;
    width:58%;
    height:82%;
    transition:
        left 2.2s cubic-bezier(.2,.8,.2,1),
        transform 2.2s cubic-bezier(.2,.8,.2,1);
    z-index:5;
}

.tree-scene.move-right{
    left:25%;
    transform:scale(.95);
}

/* ground */

.ground{
    position:absolute;
    bottom:-20px;
    left:5%;
    width:90%;
    height:90px;
    border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,75,150,.25),transparent 70%);
}

/* trunk */

.trunk{
    position:absolute;
    bottom:5%;
    left:46%;
    width:70px;
    height:0;
    border-radius:45px 45px 10px 10px;
    background:linear-gradient(90deg,#32130e,#713a1e,#3b1710);
    box-shadow:0 0 20px rgba(255,100,60,.18);
    transform:translateX(-50%);
    animation:trunkGrow 3s ease forwards;
    transform-origin:bottom;
}

@keyframes trunkGrow{
    to{height:58%;}
}

/* branches */

.branch{
    position:absolute;
    height:20px;
    width:0;
    background:linear-gradient(90deg,#3b1710,#784020);
    border-radius:20px;
    transform-origin:left center;
    z-index:2;
}

.branch.b1{
    left:47%;
    bottom:40%;
    animation:branch1 1.5s 2.7s forwards;
}

.branch.b2{
    left:48%;
    bottom:47%;
    animation:branch2 1.5s 2.9s forwards;
}

.branch.b3{
    left:46%;
    bottom:54%;
    animation:branch3 1.5s 3.1s forwards;
}

.branch.b4{
    left:50%;
    bottom:60%;
    animation:branch4 1.5s 3.3s forwards;
}

.branch.b5{
    left:45%;
    bottom:65%;
    animation:branch5 1.5s 3.5s forwards;
}

.branch.b6{
    left:49%;
    bottom:70%;
    animation:branch6 1.5s 3.7s forwards;
}

@keyframes branch1{
    to{width:210px;transform:rotate(-28deg);}
}
@keyframes branch2{
    to{width:190px;transform:rotate(28deg);}
}
@keyframes branch3{
    to{width:180px;transform:rotate(-42deg);}
}
@keyframes branch4{
    to{width:170px;transform:rotate(40deg);}
}
@keyframes branch5{
    to{width:150px;transform:rotate(-20deg);}
}
@keyframes branch6{
    to{width:140px;transform:rotate(25deg);}
}

/* =========================
   MANY HEART LEAVES
========================= */

.heart-leaf{
    position:absolute;
    width:27px;
    height:27px;
    background:linear-gradient(135deg,#ff4f9a,#ff87bd);
    transform:rotate(-45deg) scale(0);
    opacity:0;
    z-index:4;
    box-shadow:0 0 15px rgba(255,80,160,.65);
    animation:leafAppear .8s cubic-bezier(.17,.89,.32,1.49) forwards;
}

.heart-leaf::before,
.heart-leaf::after{
    content:"";
    position:absolute;
    width:27px;
    height:27px;
    border-radius:50%;
    background:inherit;
}

.heart-leaf::before{
    top:-13px;
    left:0;
}

.heart-leaf::after{
    left:13px;
    top:0;
}

@keyframes leafAppear{
    0%{
        transform:rotate(-45deg) scale(0);
        opacity:0;
    }
    70%{
        transform:rotate(-45deg) scale(1.25);
        opacity:1;
    }
    100%{
        transform:rotate(-45deg) scale(1);
        opacity:1;
    }
}

/* lots of leaves */

.l1{left:27%;top:26%;animation-delay:4.0s}
.l2{left:36%;top:20%;animation-delay:4.08s}
.l3{left:45%;top:16%;animation-delay:4.16s}
.l4{left:55%;top:19%;animation-delay:4.24s}
.l5{left:63%;top:27%;animation-delay:4.32s}
.l6{left:22%;top:34%;animation-delay:4.40s}
.l7{left:31%;top:31%;animation-delay:4.48s}
.l8{left:41%;top:28%;animation-delay:4.56s}
.l9{left:51%;top:30%;animation-delay:4.64s}
.l10{left:61%;top:34%;animation-delay:4.72s}
.l11{left:70%;top:37%;animation-delay:4.80s}

.l12{left:25%;top:43%;animation-delay:4.88s}
.l13{left:34%;top:39%;animation-delay:4.96s}
.l14{left:44%;top:37%;animation-delay:5.04s}
.l15{left:54%;top:39%;animation-delay:5.12s}
.l16{left:64%;top:43%;animation-delay:5.20s}
.l17{left:73%;top:46%;animation-delay:5.28s}

.l18{left:29%;top:50%;animation-delay:5.36s}
.l19{left:39%;top:47%;animation-delay:5.44s}
.l20{left:49%;top:46%;animation-delay:5.52s}
.l21{left:59%;top:49%;animation-delay:5.60s}
.l22{left:68%;top:53%;animation-delay:5.68s}

.l23{left:35%;top:57%;animation-delay:5.76s}
.l24{left:45%;top:55%;animation-delay:5.84s}
.l25{left:55%;top:56%;animation-delay:5.92s}
.l26{left:64%;top:59%;animation-delay:6.00s}
.l27{left:40%;top:64%;animation-delay:6.08s}
.l28{left:50%;top:62%;animation-delay:6.16s}
.l29{left:59%;top:65%;animation-delay:6.24s}
.l30{left:48%;top:70%;animation-delay:6.32s}

/* message */

.tree-message{
    position:absolute;
    left:4%;
    top:30%;
    width:42%;
    opacity:0;
    transform:translateX(-30px);
    transition:1.5s ease;
    z-index:10;
}

.tree-message.show{
    opacity:1;
    transform:translateX(0);
}

.world-luckier{
    font-size:clamp(28px,4vw,55px);
    font-style:italic;
    color:#ffd8ed;
    text-shadow:0 0 20px #ff4fa3;
    margin-bottom:30px;
}

.handwriting{
    font-family:"Brush Script MT","Segoe Script",cursive;
    font-size:clamp(25px,3vw,40px);
    line-height:1.6;
    color:#fff;
    min-height:200px;
    text-shadow:0 0 15px rgba(255,255,255,.4);
}

.pen{
    display:inline-block;
    width:8px;
    height:35px;
    margin-left:5px;
    vertical-align:middle;
    background:#ff83bc;
    border-radius:5px;
    box-shadow:0 0 12px #ff83bc;
    animation:penBlink .5s infinite;
}

@keyframes penBlink{
    50%{opacity:.2;}
}

/* balloons */

.balloon{
    position:absolute;
    bottom:-150px;
    width:50px;
    height:65px;
    border-radius:50% 50% 45% 45%;
    z-index:8;
    animation:balloonUp linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:1px;
    height:100px;
    background:rgba(255,255,255,.5);
    left:50%;
    top:100%;
}

.b1b{left:8%;background:#ff5b9f;animation-duration:11s;}
.b2b{left:18%;background:#8b6cff;animation-duration:14s;animation-delay:2s;}
.b3b{left:76%;background:#ffcf70;animation-duration:12s;animation-delay:4s;}
.b4b{left:88%;background:#67d9ff;animation-duration:15s;animation-delay:1s;}

@keyframes balloonUp{
    to{
        transform:translateY(-125vh) rotate(15deg);
    }
}

/* streamers */

.streamer{
    position:absolute;
    top:-20px;
    width:10px;
    height:180px;
    border-radius:50%;
    border-left:4px solid rgba(255,100,180,.7);
    transform-origin:top;
    animation:sway 3s ease-in-out infinite;
    z-index:3;
}

.s1{left:5%;transform:rotate(10deg);}
.s2{left:12%;animation-delay:.5s;}
.s3{right:8%;transform:rotate(-10deg);animation-delay:1s;}
.s4{right:16%;animation-delay:1.5s;}

@keyframes sway{
    50%{transform:rotate(-15deg) translateX(10px);}
}

/* confetti */

.confetti{
    position:absolute;
    width:7px;
    height:14px;
    top:-30px;
    animation:confettiFall linear forwards;
    z-index:20;
}

@keyframes confettiFall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* mouse hearts */

.mouse-heart{
    position:fixed;
    pointer-events:none;
    color:#ff73b2;
    font-size:18px;
    z-index:100;
    animation:mouseHeart .9s ease forwards;
}

@keyframes mouseHeart{
    to{
        transform:translateY(-35px) scale(.2);
        opacity:0;
    }
}

/* =========================
   PAGE 5 - PHOTO / CD
========================= */

#photoPage{
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 20% 30%,rgba(255,80,160,.22),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(90,80,255,.25),transparent 35%),
        linear-gradient(135deg,#090014,#21002e,#080014);
}

.photo-stars{
    position:absolute;
    inset:0;
}

.photo-content{
    position:relative;
    z-index:5;
    width:min(1000px,92%);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:55px;
}

.photo-frame{
    width:min(390px,70vw);
    padding:13px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff8bc4,#8f6cff,#ffcc78);
    box-shadow:
        0 0 25px #ff62ac77,
        0 0 80px #8b6cff44;
    transform:rotate(-3deg);
    animation:photoFloat 4s ease-in-out infinite;
}

.photo-frame img{
    display:block;
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:17px;
}

@keyframes photoFloat{
    50%{
        transform:rotate(3deg) translateY(-12px);
    }
}

/* CD */

.cd-area{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
}

.cd{
    width:min(270px,45vw);
    aspect-ratio:1;
    border-radius:50%;
    background:
        radial-gradient(circle,
            #151515 0 8%,
            #aaa 8.5% 10%,
            #222 10.5% 20%,
            #555 20.5% 21%,
            #151515 21.5% 40%,
            #777 40.5% 41%,
            #191919 41.5% 60%,
            #999 60.5% 61%,
            #111 61.5% 100%);
    box-shadow:
        0 0 30px rgba(255,255,255,.2),
        inset 0 0 35px rgba(255,255,255,.2);
    position:relative;
    animation:spinCD 3s linear infinite;
}

.cd::before{
    content:"";
    position:absolute;
    inset:15%;
    border-radius:50%;
    background:conic-gradient(
        #ff5caa,
        #ffd76b,
        #62dfff,
        #9c72ff,
        #ff5caa
    );
    opacity:.35;
    filter:blur(2px);
}

.cd-hole{
    position:absolute;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#100016;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
}

@keyframes spinCD{
    to{transform:rotate(360deg);}
}

/* music player */

.music-player{
    width:min(430px,85vw);
    padding:20px 23px;
    border-radius:20px;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    box-shadow:0 0 30px rgba(255,70,160,.15);
}

.music-info{
    display:flex;
    align-items:center;
    gap:15px;
}

.music-cover{
    width:58px;
    height:58px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff5b9e,#7457ff);
    font-size:25px;
}

.music-text{
    text-align:left;
}

.song-name{
    font-size:20px;
    font-weight:bold;
}

.artist-name{
    margin-top:5px;
    opacity:.65;
    font-size:14px;
}

.equalizer{
    margin-top:18px;
    height:25px;
    display:flex;
    align-items:flex-end;
    gap:4px;
}

.eq{
    width:5px;
    height:8px;
    background:#ff70b2;
    border-radius:5px;
    animation:eq 1s ease-in-out infinite alternate;
}

.eq:nth-child(2){animation-delay:.1s}
.eq:nth-child(3){animation-delay:.2s}
.eq:nth-child(4){animation-delay:.3s}
.eq:nth-child(5){animation-delay:.4s}
.eq:nth-child(6){animation-delay:.5s}
.eq:nth-child(7){animation-delay:.6s}

@keyframes eq{
    to{height:24px;}
}

.photo-title{
    position:absolute;
    top:8%;
    width:100%;
    text-align:center;
    font-size:clamp(25px,4vw,48px);
    color:#ffd9ed;
    text-shadow:0 0 25px #ff5ca7;
}

/* responsive */

@media(max-width:700px){

    .moon{
        width:65px;
        height:65px;
        right:7%;
    }

    .tree-scene{
        width:100%;
        height:70%;
        bottom:0;
    }

    .tree-scene.move-right{
        left:42%;
        transform:scale(.62);
        transform-origin:bottom center;
    }

    .tree-message{
        left:4%;
        top:20%;
        width:55%;
    }

    .world-luckier{
        font-size:26px;
    }

    .handwriting{
        font-size:22px;
        line-height:1.5;
    }

    .heart-leaf{
        width:21px;
        height:21px;
    }

    .heart-leaf::before,
    .heart-leaf::after{
        width:21px;
        height:21px;
    }

    .heart-leaf::before{
        top:-10px;
    }

    .heart-leaf::after{
        left:10px;
    }

    .photo-content{
        flex-direction:column;
        gap:30px;
        padding-top:60px;
    }

    .photo-frame{
        width:220px;
    }

    .cd{
        width:150px;
    }

    .music-player{
        width:85vw;
    }
}
</style>
</head>

<body>

<!-- =========================
     PAGE 1
========================= -->

<section id="lockPage" class="page active">

    <div class="lock-glow"></div>

    <div class="lock-card">

        <div class="lock-icon">🔐</div>

        <h1>Something is waiting...</h1>

        <p>Only someone special can unlock this 💗</p>

        <button class="unlock-btn" onclick="unlockSite()">
            Unlock Surprise
        </button>

    </div>

</section>


<!-- =========================
     PAGE 2
========================= -->

<section id="wishPage" class="page">

    <div class="wish-box">

        <div id="wish1" class="wish-line"></div>
        <div id="wish2" class="wish-line"></div>
        <div id="wish3" class="wish-line"></div>

    </div>

</section>


<!-- =========================
     PAGE 3
========================= -->

<section id="surprisePage" class="page">

    <div class="prank-content">

        <h1>OHHH... YOU THOUGHT THAT'S IT?? 😭</h1>

        <button class="wait-btn" onclick="continueSurprise()">
            WAIT... WHAT?
        </button>

    </div>

</section>


<!-- =========================
     PAGE 4 TREE
========================= -->

<section id="treePage" class="page">

    <div class="moon"></div>

    <div class="streamer s1"></div>
    <div class="streamer s2"></div>
    <div class="streamer s3"></div>
    <div class="streamer s4"></div>

    <div class="balloon b1b"></div>
    <div class="balloon b2b"></div>
    <div class="balloon b3b"></div>
    <div class="balloon b4b"></div>

    <div class="tree-scene" id="treeScene">

        <div class="ground"></div>

        <div class="trunk"></div>

        <div class="branch b1"></div>
        <div class="branch b2"></div>
        <div class="branch b3"></div>
        <div class="branch b4"></div>
        <div class="branch b5"></div>
        <div class="branch b6"></div>

        <!-- MANY MANY HEART LEAVES -->

        <div class="heart-leaf l1"></div>
        <div class="heart-leaf l2"></div>
        <div class="heart-leaf l3"></div>
        <div class="heart-leaf l4"></div>
        <div class="heart-leaf l5"></div>
        <div class="heart-leaf l6"></div>
        <div class="heart-leaf l7"></div>
        <div class="heart-leaf l8"></div>
        <div class="heart-leaf l9"></div>
        <div class="heart-leaf l10"></div>
        <div class="heart-leaf l11"></div>
        <div class="heart-leaf l12"></div>
        <div class="heart-leaf l13"></div>
        <div class="heart-leaf l14"></div>
        <div class="heart-leaf l15"></div>
        <div class="heart-leaf l16"></div>
        <div class="heart-leaf l17"></div>
        <div class="heart-leaf l18"></div>
        <div class="heart-leaf l19"></div>
        <div class="heart-leaf l20"></div>
        <div class="heart-leaf l21"></div>
        <div class="heart-leaf l22"></div>
        <div class="heart-leaf l23"></div>
        <div class="heart-leaf l24"></div>
        <div class="heart-leaf l25"></div>
        <div class="heart-leaf l26"></div>
        <div class="heart-leaf l27"></div>
        <div class="heart-leaf l28"></div>
        <div class="heart-leaf l29"></div>
        <div class="heart-leaf l30"></div>

    </div>


    <!-- LEFT SIDE MESSAGE -->

    <div class="tree-message" id="treeMessage">

        <div class="world-luckier">
            The world got luckier... ✨
        </div>

        <div class="handwriting" id="handwriting"></div>

    </div>

</section>


<!-- =========================
     PAGE 5 PHOTO + CD
========================= -->

<section id="photoPage" class="page">

    <div class="photo-stars" id="photoStars"></div>

    <div class="photo-title">
        And here's someone very special... ❤️
    </div>

    <div class="photo-content">

        <!-- PHOTO -->

        <div class="photo-frame">
            <img src="boin.jpg" alt="Special memory">
        </div>


        <!-- CD + MUSIC -->

        <div class="cd-area">

            <div class="cd">
                <div class="cd-hole"></div>
            </div>

            <div class="music-player">

                <div class="music-info">

                    <div class="music-cover">
                        🎵
                    </div>

                    <div class="music-text">

                        <div class="song-name">
                            Tum
                        </div>

                        <div class="artist-name">
                            Birthday soundtrack ❤️
                        </div>

                    </div>

                </div>

                <div class="equalizer">

                    <div class="eq"></div>
                    <div class="eq"></div>
                    <div class="eq"></div>
                    <div class="eq"></div>
                    <div class="eq"></div>
                    <div class="eq"></div>
                    <div class="eq"></div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- MUSIC -->

<audio id="birthdayMusic" src="music/earrings.mp3"></audio>
<audio id="tumMusic" src="music/tum.mp3"></audio>


<script>

/* =========================
   PAGE CONTROL
========================= */

function showPage(id){

    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");
}


/* =========================
   PAGE 1
========================= */

function unlockSite(){

    const password = prompt("Enter the secret password 💗");

    if(password === "saba123"){

        showPage("wishPage");

        createFloatingHearts();

        startBirthdayWish();

    }else{

        alert("Wrong password 😭 Try again!");

    }

}


/* =========================
   TYPEWRITER
========================= */

function typeWriter(element,text,speed){

    return new Promise(resolve=>{

        let i=0;

        function write(){

            if(i < text.length){

                element.innerHTML += text.charAt(i);

                i++;

                setTimeout(write,speed);

            }else{

                resolve();

            }

        }

        write();

    });

}


/* =========================
   FIRST WISH
========================= */

async function startBirthdayWish(){

    await typeWriter(
        document.getElementById("wish1"),
        "Happy Birthday to youu.. ❤️",
        70
    );

    await typeWriter(
        document.getElementById("wish2"),
        "Thank youu soo muchhh for come into my lifeee.. 🥹",
        65
    );

    await typeWriter(
        document.getElementById("wish3"),
        "Happy birthday again.. 🎂",
        70
    );

    setTimeout(()=>{

        showPage("surprisePage");

    },10000);

}


/* =========================
   FLOATING HEARTS
========================= */

function createFloatingHearts(){

    setInterval(()=>{

        const heart=document.createElement("div");

        heart.className="floating-heart";

        heart.innerHTML=["❤️","💗","💖","💕","💘"]
            [Math.floor(Math.random()*5)];

        heart.style.left=Math.random()*100+"%";

        heart.style.animationDuration=
            (5+Math.random()*5)+"s";

        document.getElementById("wishPage")
            .appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },10000);

    },500);

}


/* =========================
   TREE PAGE
========================= */

async function continueSurprise(){

    showPage("treePage");

    createStars();

    createConfetti();

    /* EARLIER SONG STARTS */

    const earrings=document.getElementById("birthdayMusic");

    earrings.currentTime=0;

    earrings.volume=.8;

    earrings.play().catch(()=>{});


    /*
       TREE ANIMATION
       trunk -> branches -> leaves
    */

    await wait(7000);


    /* TREE MOVES TO THE RIGHT */

    document
        .getElementById("treeScene")
        .classList.add("move-right");


    await wait(1900);


    /* MESSAGE APPEARS */

    document
        .getElementById("treeMessage")
        .classList.add("show");


    await wait(900);


    startHandwriting();

}


/* =========================
   WAIT
========================= */

function wait(ms){

    return new Promise(resolve=>{
        setTimeout(resolve,ms);
    });

}


/* =========================
   STARS
========================= */

function createStars(){

    for(let i=0;i<80;i++){

        const star=document.createElement("div");

        star.className="star";

        star.style.left=Math.random()*100+"%";

        star.style.top=Math.random()*85+"%";

        star.style.animationDelay=
            Math.random()*3+"s";

        star.style.opacity=
            .3+Math.random()*.7;

        document
            .getElementById("treePage")
            .appendChild(star);

    }

}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    for(let i=0;i<70;i++){

        const c=document.createElement("div");

        c.className="confetti";

        c.style.left=Math.random()*100+"%";

        c.style.animationDuration=
            (3+Math.random()*5)+"s";

        c.style.animationDelay=
            Math.random()*4+"s";

        c.style.transform=
            `rotate(${Math.random()*360}deg)`;

        document
            .getElementById("treePage")
            .appendChild(c);

    }

}


/* =========================
   HANDWRITING
========================= */

async function startHandwriting(){

    const box=document.getElementById("handwriting");

    const lines=[

        "Happy Birthday too youu.. ❤️",

        "The one of the sweetest and chaotic person in my lifee.. 🥹",

        "Many many happy returns of the dayyy! 🎂",

        "Stay exactly the way you are. ❤️"

    ];


    for(const line of lines){

        await writeHandLine(box,line);

        await wait(500);

    }


    /* after the handwriting finishes,
       open the photo/music page */

    await wait(2500);

    openPhotoPage();

}


/* =========================
   HANDWRITING LINE
========================= */

function writeHandLine(box,text){

    return new Promise(resolve=>{

        const line=document.createElement("div");

        box.appendChild(line);

        const cursor=document.createElement("span");

        cursor.className="pen";

        line.appendChild(cursor);


        let i=0;

        function write(){

            if(i<text.length){

                cursor.remove();

                line.innerHTML+=text.charAt(i);

                line.appendChild(cursor);

                i++;

                setTimeout(write,65);

            }else{

                setTimeout(()=>{

                    cursor.remove();

                    resolve();

                },500);

            }

        }

        write();

    });

}


/* =========================
   HEART LEAF CLICK EFFECT
========================= */

document.addEventListener("click",function(e){

    if(
        e.target.classList.contains("heart-leaf")
    ){

        for(let i=0;i<8;i++){

            const h=document.createElement("div");

            h.innerHTML="💗";

            h.style.position="fixed";

            h.style.left=e.clientX+"px";

            h.style.top=e.clientY+"px";

            h.style.pointerEvents="none";

            h.style.zIndex="999";

            h.style.fontSize=
                (12+Math.random()*14)+"px";

            document.body.appendChild(h);

            const x=(Math.random()-.5)*100;

            const y=(Math.random()-.5)*100;

            h.animate(

                [
                    {
                        transform:"translate(0,0) scale(1)",
                        opacity:1
                    },
                    {
                        transform:
                            `translate(${x}px,${y}px) scale(0)`,
                        opacity:0
                    }
                ],

                {
                    duration:900,
                    easing:"ease-out"
                }

            );

            setTimeout(()=>{
                h.remove();
            },900);

        }

    }

});


/* =========================
   MOUSE HEART TRAIL
========================= */

document.addEventListener("mousemove",function(e){

    if(
        document
        .getElementById("treePage")
        .classList.contains("active")
    ){

        if(Math.random()>.88){

            const heart=document.createElement("div");

            heart.className="mouse-heart";

            heart.innerHTML="♥";

            heart.style.left=e.clientX+"px";

            heart.style.top=e.clientY+"px";

            document.body.appendChild(heart);

            setTimeout(()=>{
                heart.remove();
            },900);

        }

    }

});


/* =========================
   PHOTO PAGE
========================= */

function openPhotoPage(){

    const earrings=
        document.getElementById("birthdayMusic");

    const tum=
        document.getElementById("tumMusic");


    /* old song OFF */

    earrings.pause();

    earrings.currentTime=0;


    /* new song ON */

    tum.currentTime=0;

    tum.volume=.8;

    tum.play().catch(()=>{});


    showPage("photoPage");

    createPhotoStars();

}


/* =========================
   PHOTO PAGE STARS
========================= */

function createPhotoStars(){

    const container=
        document.getElementById("photoStars");

    for(let i=0;i<65;i++){

        const star=document.createElement("div");

        star.className="star";

        star.style.left=Math.random()*100+"%";

        star.style.top=Math.random()*100+"%";

        star.style.animationDelay=
            Math.random()*3+"s";

        container.appendChild(star);

    }

}

</script>

</body>
</html>
